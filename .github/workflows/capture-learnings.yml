name: Capture Learnings

# After a PR merges into main, Copilot CLI runs
# .github/prompts/capture-learnings.prompt.md for that PR. The workflow gives
# Copilot the comments as a data file and takes the result files back.
# Copilot holds only the token that authenticates its own model requests,
# and touches no branch. Later steps commit the knowledge file, open the
# knowledge PR, and comment on the merged PR. The same prompt also runs
# locally on an open PR during its implementation.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR to analyse. Give its number or its URL.
        required: true

permissions:
  contents: read

concurrency:
  group: capture-learnings
  cancel-in-progress: false

jobs:
  capture-learnings:
    name: capture learnings
    # Skip unmerged PRs, fork PRs (their token cannot write), and the
    # knowledge PRs that this workflow opens. A manual run names its own PR,
    # so the step that reads the number applies the fork check instead.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'learnings/') )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      # A manual run gives a PR number or a PR URL. The next step reduces it
      # to the number that every later step and the prompt use.
      PR_INPUT: ${{ inputs.pr || github.event.pull_request.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          # The default writes the token into .git/config, where the grep tool
          # of Copilot can read it. The push step sets its own credential.
          persist-credentials: false

      # A manual run gives a PR number or a PR URL. Reduce it to the number
      # that every later step and the prompt use.
      - name: Read the PR number
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo
            const input = process.env.PR_INPUT.trim()
            // A URL of another host or another repository holds a number that
            // is valid here, so compare the whole prefix and not the number.
            let number
            if (/^[a-z][a-z0-9+.-]*:/i.test(input)) {
              const prefix = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/pull/`
              if (!input.startsWith(prefix)) {
                core.setFailed(`The PR URL is not a PR of ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}.`)
                return
              }
              number = Number(input.slice(prefix.length).split(/[/?#]/)[0])
            } else {
              number = Number(input.replace(/^#/, ''))
            }
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed(`"${input}" is not a PR number or a PR URL.`)
              return
            }
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number})
            // The pull_request trigger skips a fork PR, because the job holds
            // a write token. A manual run gets the same restriction.
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed(`PR #${number} comes from the fork ${pr.head.repo?.full_name}.`)
              return
            }
            core.exportVariable('PR_NUMBER', number)
            // The result files stay outside the repository, so no step commits
            // them by accident. RUNNER_TEMP is the temporary directory of the
            // runner, and the runner deletes it after the job. A job-level env
            // value takes no expansion of RUNNER_TEMP, so export OUTPUT here.
            core.exportVariable('OUTPUT', `${process.env.RUNNER_TEMP}/capture-learnings`)

      # Every comment on the PR can become a rule, whatever its author. The
      # workflow collects the comments itself and gives Copilot a data file,
      # so no comment text can reach Copilot as a GitHub API instruction.
      - name: Collect the comments
        id: comments
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo
            const pull_number = Number(process.env.PR_NUMBER)
            const get = (route, map) => github.paginate(route, {owner, repo, pull_number, issue_number: pull_number, per_page: 100}).then(rows => rows.map(map))
            const comments = [
              ...await get(github.rest.pulls.listReviewComments, c => ({kind: 'review thread', author: c.user.login, path: c.path, line: c.line, url: c.html_url, body: c.body})),
              ...await get(github.rest.pulls.listReviews, r => ({kind: 'review body', author: r.user.login, url: r.html_url, body: r.body})),
              ...await get(github.rest.issues.listComments, c => ({kind: 'PR comment', author: c.user.login, url: c.html_url, body: c.body})),
            ].filter(c => c.body)
            await require('node:fs/promises').mkdir(process.env.OUTPUT, {recursive: true})
            await require('node:fs/promises').writeFile(`${process.env.OUTPUT}/comments.json`, JSON.stringify(comments, null, 2))
            core.setOutput('count', comments.length)
            if (comments.length === 0) {
              await github.rest.issues.createComment({owner, repo, issue_number: pull_number, body: 'No new review learnings. The PR has no comments.'})
            }

      - name: Set up Node.js
        if: steps.comments.outputs.count != '0'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        if: steps.comments.outputs.count != '0'
        run: npm install -g @github/copilot@1.0.91

      - name: Configure git identity
        if: steps.comments.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Copilot reads the comment data file and writes result files only.
      # --add-dir grants the OUTPUT directory, because path verification
      # allows the working directory alone and the result files stay outside
      # the repository. Each --allow-tool pattern names one result file: a
      # write pattern matches a file and never a directory prefix, so a
      # directory pattern silently grants nothing and every write then waits
      # for an approval that --no-ask-user cannot give. Copilot still
      # gets no git and no gh, so a prompt injection in a comment cannot reach
      # the repository or another PR. COPILOT_GITHUB_TOKEN authenticates the
      # model requests, and the name keeps GH_TOKEN out of the shell, so an
      # injected gh command finds no credential. The next steps commit, push,
      # open the PR, and comment.
      - name: Generate learnings with Copilot
        if: steps.comments.outputs.count != '0'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT"
          copilot -s --no-ask-user --model gpt-5.6-luna \
            --add-dir "$OUTPUT" \
            --allow-tool="write($OUTPUT/comment.md)" \
            --allow-tool="write($OUTPUT/pr-body.md)" \
            --allow-tool="write($OUTPUT/knowledge.md)" \
            --allow-tool="write($OUTPUT/improvements.md)" \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(wc:*)' \
            --deny-tool='shell(gh:*)' \
            --deny-tool='shell(git:*)' \
            --deny-tool='shell(curl:*)' \
            --secret-env-vars='COPILOT_GITHUB_TOKEN' \
            -p "MODE: ci PR: #${PR_NUMBER} OUTPUT: ${OUTPUT} $(cat .github/prompts/capture-learnings.prompt.md)"

      # Copilot cannot commit, so the workflow does. A run that claims a
      # capture without writing knowledge.md is a failure, not an empty run.
      - name: Check the result files
        id: result
        if: steps.comments.outputs.count != '0'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const read = name => {
              const path = `${process.env.OUTPUT}/${name}`
              return fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : ''
            }
            const comment = read('comment.md')
            if (!comment) return core.setFailed('Copilot wrote no comment.md.')
            const claims = comment.startsWith('Captured review learnings')
            // The prompt may write either file, or both.
            const files = ['knowledge.md', 'improvements.md'].filter(name => read(name))
            const captured = files.length > 0
            // The comment and the artifacts must agree in both directions. A
            // claim without a file hides a failure, and a file without a
            // claim publishes entries that the comment does not report.
            if (claims !== captured) {
              return core.setFailed(claims
                ? 'comment.md claims a capture, but no knowledge.md and no improvements.md exist.'
                : `${files.join(' and ')} exists, but comment.md reports no capture.`)
            }
            if (captured && !read('pr-body.md')) {
              return core.setFailed(`${files.join(' and ')} exists, but pr-body.md is missing.`)
            }
            // The prompt allows 2 new rules in knowledge.md for one PR, and
            // no change to the text of an entry that the run does not add.
            const headings = text => (text.match(/^## .*$/gm) ?? [])
            for (const name of files) {
              const before = headings(fs.readFileSync(`docs/agents/${name}`, 'utf8'))
              const added = headings(read(name)).filter(h => !before.includes(h))
              const removed = before.filter(h => !headings(read(name)).includes(h))
              if (removed.length) {
                return core.setFailed(`${name} drops the entries: ${removed.join(', ')}`)
              }
              if (name === 'knowledge.md' && added.length > 2) {
                return core.setFailed(`knowledge.md adds ${added.length} rules, and the limit for one PR is 2.`)
              }
            }
            core.setOutput('captured', String(captured))
            core.setOutput('files', files.join(' '))

      - name: Commit and push the knowledge branch
        if: steps.result.outputs.captured == 'true'
        env:
          # The checkout keeps no credential, so the push carries its own.
          GITHUB_TOKEN: ${{ github.token }}
          FILES: ${{ steps.result.outputs.files }}
        run: |
          git remote set-url origin \
            "https://x-access-token:$GITHUB_TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          branch="learnings/pr-$PR_NUMBER"
          git switch -c "$branch"
          for name in $FILES; do
            cp "$OUTPUT/$name" "docs/agents/$name"
            git add "docs/agents/$name"
          done
          git commit -m "docs: capture review learnings from #$PR_NUMBER"
          # A re-run replaces the branch of the earlier run and reuses its PR.
          git push --force origin "$branch"

      - name: Open the knowledge PR and comment
        if: steps.comments.outputs.count != '0'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const {owner, repo} = context.repo
            const issue_number = Number(process.env.PR_NUMBER)
            const title = `docs: capture review learnings from #${issue_number}`
            let body = fs.readFileSync(`${process.env.OUTPUT}/comment.md`, 'utf8')
            if (process.env.CAPTURED === 'true') {
              const head = `learnings/pr-${issue_number}`
              // A re-run reuses the PR that the earlier run opened.
              const {data: open} = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, state: 'open'})
              const pr = open[0] ?? (await github.rest.pulls.create({
                owner, repo, base: 'main', head, title,
                body: fs.readFileSync(`${process.env.OUTPUT}/pr-body.md`, 'utf8'),
              })).data
              if (!open[0]) {
                await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: ['documentation']})
              }
              body += `\nKnowledge PR: ${pr.html_url}\n`
            }
            await core.summary.addRaw(body).write()
            await github.rest.issues.createComment({owner, repo, issue_number, body})
        env:
          CAPTURED: ${{ steps.result.outputs.captured }}

      - name: Report a failed capture
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // Only the validated number is safe. An unvalidated input can
            // name a PR of another repository, so a number taken from it
            // would send this report to an unrelated PR of this repository.
            const issue_number = Number(process.env.PR_NUMBER)
            if (!issue_number) {
              core.warning('The PR number is not known, so no comment was posted.')
              return
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`
            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: `Capture of review learnings failed. See the workflow run: ${url}`,
            })
