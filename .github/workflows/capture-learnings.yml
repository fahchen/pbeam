name: Capture Learnings

# After a PR merges into main, Copilot CLI runs
# .github/prompts/capture-learnings.prompt.md for that PR. Copilot generates
# and commits the knowledge change and writes the result files. A separate
# step pushes, opens the knowledge PR, and comments on the merged PR. The same
# prompt also runs locally on an open PR during its implementation.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capture-learnings
  cancel-in-progress: false

jobs:
  capture-learnings:
    name: capture learnings
    # Skip unmerged PRs and the knowledge PRs that this workflow opens.
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'learnings/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OUTPUT: /tmp/capture-learnings
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.91

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate learnings with Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        # Copilot reads GitHub, edits and commits docs/agents/knowledge.md, and
        # writes result files. The next step pushes, opens the PR, and comments.
        run: |
          mkdir -p "$OUTPUT"
          copilot -s --no-ask-user \
            --allow-tool='write' \
            --allow-tool='shell(gh api:*)' \
            --allow-tool='shell(gh pr view:*)' \
            --allow-tool='shell(git switch:*)' \
            --allow-tool='shell(git add:*)' \
            --allow-tool='shell(git commit:*)' \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(wc:*)' \
            -p "MODE: ci PR: #${PR_NUMBER} OUTPUT: ${OUTPUT} $(cat .github/prompts/capture-learnings.prompt.md)"

      - name: Push, open the knowledge PR, and comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$OUTPUT/comment.md" ]; then
            echo "Copilot did not write comment.md" >&2
            exit 1
          fi
          branch="learnings/pr-$PR_NUMBER"
          if [ "$(git branch --show-current)" != "$branch" ]; then
            if ! git diff --quiet; then
              echo "Copilot changed files without a commit" >&2
              exit 1
            fi
            gh pr comment "$PR_NUMBER" --body-file "$OUTPUT/comment.md"
            exit 0
          fi
          unexpected=$(git diff --name-only origin/main...HEAD | grep -vx 'docs/agents/knowledge.md' || true)
          if [ -n "$unexpected" ] || ! git diff --quiet; then
            echo "Copilot changed files other than docs/agents/knowledge.md:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "docs: capture review learnings from #$PR_NUMBER" \
            --body-file "$OUTPUT/pr-body.md" --label documentation)
          { cat "$OUTPUT/comment.md"; echo; echo "Knowledge PR: $url"; } > "$OUTPUT/final-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$OUTPUT/final-comment.md"

      - name: Report a failed capture
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Capture of review learnings failed. See the workflow run: $RUN_URL"
