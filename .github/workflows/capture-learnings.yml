name: Capture Learnings

# After a PR merges into main, Copilot CLI runs
# .github/prompts/capture-learnings.prompt.md for that PR. Copilot generates
# and commits the knowledge change and writes the result files. A separate
# step pushes, opens the knowledge PR, and comments on the merged PR. The same
# prompt also runs locally on an open PR during its implementation.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR to analyse. Give its number or its URL.
        required: true

permissions:
  contents: read

concurrency:
  group: capture-learnings
  cancel-in-progress: false

jobs:
  capture-learnings:
    name: capture learnings
    # Skip unmerged PRs, fork PRs (their token cannot write), and the
    # knowledge PRs that this workflow opens. A manual run names its own PR,
    # so it skips these checks.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'learnings/') )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      # A manual run gives a PR number or a PR URL. The next step reduces it
      # to the number that every later step and the prompt use.
      PR_INPUT: ${{ inputs.pr || github.event.pull_request.number }}
      OUTPUT: /tmp/capture-learnings
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      # gh pr view accepts a number, a URL, and a branch name, but it reads
      # the number out of a URL of any repository. Reject a foreign URL.
      - name: Read the PR number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR_INPUT" in
            http*)
              prefix="${{ github.server_url }}/$GITHUB_REPOSITORY/pull/"
              case "$PR_INPUT" in
                "$prefix"*) ;;
                *) echo "The PR URL is not a PR of $GITHUB_REPOSITORY." >&2; exit 1 ;;
              esac
              ;;
          esac
          number=$(gh pr view "$PR_INPUT" --json number --jq .number)
          # The pull_request trigger rejects a fork PR, because the job holds a
          # write token. A manual run gets the same restriction.
          head=$(gh pr view "$number" --json headRepositoryOwner,headRepository \
            --jq '.headRepositoryOwner.login + "/" + .headRepository.name')
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$number comes from the fork $head." >&2
            exit 1
          fi
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"

      # Every comment on the PR can become a rule, whatever its author. The
      # workflow collects the comments itself and gives Copilot a data file,
      # so no comment text can reach Copilot as a GitHub API instruction.
      - name: Collect the comments
        id: comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT"
          {
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
              --jq '.[] | {kind: "review thread", author: .user.login, path: .path, line: .line, url: .html_url, body: .body}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq '.[] | select(.body != "") | {kind: "review body", author: .user.login, url: .html_url, body: .body}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | {kind: "PR comment", author: .user.login, url: .html_url, body: .body}'
          } | jq -s '.' > "$OUTPUT/comments.json"
          count=$(jq 'length' "$OUTPUT/comments.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --body "No new review learnings. The PR has no comments."
          fi

      - name: Install Copilot CLI
        if: steps.comments.outputs.count != '0'
        run: npm install -g @github/copilot@1.0.91

      - name: Configure git identity
        if: steps.comments.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Copilot reads the comment data file and writes result files only. It
      # gets no GitHub token, no git, and no gh, so a prompt injection in a
      # comment cannot reach the repository, the token, or another PR. The
      # next steps commit, push, open the PR, and comment.
      - name: Generate learnings with Copilot
        if: steps.comments.outputs.count != '0'
        run: |
          copilot -s --no-ask-user --model gpt-5.6-luna \
            --allow-tool='write' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(wc:*)' \
            -p "MODE: ci PR: #${PR_NUMBER} OUTPUT: ${OUTPUT} $(cat .github/prompts/capture-learnings.prompt.md)"

      # Copilot cannot commit, so the workflow does. A run that claims a
      # capture without writing knowledge.md is a failure, not an empty run.
      - name: Commit, push, open the knowledge PR, and comment
        if: steps.comments.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment="$OUTPUT/comment.md"
          if [ ! -s "$comment" ]; then
            echo "Copilot wrote no comment.md." >&2
            exit 1
          fi
          captured=""
          if [ -s "$OUTPUT/knowledge.md" ]; then
            captured=yes
          fi
          if grep -q "^Captured review learnings" "$comment" && [ -z "$captured" ]; then
            echo "comment.md claims a capture, but knowledge.md is missing." >&2
            exit 1
          fi
          if [ -n "$captured" ]; then
            if [ ! -s "$OUTPUT/pr-body.md" ]; then
              echo "knowledge.md exists, but pr-body.md is missing." >&2
              exit 1
            fi
            branch="learnings/pr-$PR_NUMBER"
            git switch -c "$branch"
            cp "$OUTPUT/knowledge.md" docs/agents/knowledge.md
            git commit -m "docs: capture review learnings from #$PR_NUMBER" \
              -- docs/agents/knowledge.md
            # A re-run replaces the branch of the earlier run and reuses its PR.
            git push --force origin "$branch"
            url=$(gh pr view "$branch" --json url --jq .url 2>/dev/null \
              || gh pr create --base main --head "$branch" \
                --title "docs: capture review learnings from #$PR_NUMBER" \
                --body-file "$OUTPUT/pr-body.md" --label documentation)
            printf '\nKnowledge PR: %s\n' "$url" >> "$comment"
          fi
          cat "$comment" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file "$comment"

      - name: Report a failed capture
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # PR_NUMBER is empty when the step that reads it is the one that failed.
          gh pr comment "${PR_NUMBER:-$PR_INPUT}" \
            --body "Capture of review learnings failed. See the workflow run: $RUN_URL"
