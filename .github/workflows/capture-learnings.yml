name: Capture Learnings

# After a PR merges into main, Copilot CLI runs
# .github/prompts/capture-learnings.prompt.md for that PR. The same prompt
# also runs locally on an open PR during its implementation.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capture-learnings
  cancel-in-progress: false

jobs:
  capture-learnings:
    name: capture learnings
    # Skip unmerged PRs and the knowledge PRs that this workflow opens.
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'learnings/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.91

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run capture-learnings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          copilot -s --no-ask-user \
            --allow-tool='write' \
            --allow-tool='shell(gh pr view:*)' \
            --allow-tool='shell(gh pr create:*)' \
            --allow-tool='shell(gh pr comment:*)' \
            --allow-tool='shell(gh api:*)' \
            --allow-tool='shell(git switch:*)' \
            --allow-tool='shell(git add:*)' \
            --allow-tool='shell(git commit:*)' \
            --allow-tool='shell(git push:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(wc:*)' \
            --deny-tool='shell(git push origin main)' \
            -p "PR: #${PR_NUMBER} $(cat .github/prompts/capture-learnings.prompt.md)"

      - name: Report a failed capture
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Capture of review learnings failed. See the workflow run: $RUN_URL"
