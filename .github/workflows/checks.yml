name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run of the earlier push. Each push to main gets its own group, so that no push to main is cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # The next step compares the base and head commits of a pull request, so it needs their history.
          fetch-depth: 0

      # The job always runs, so that the required `checks` status is always reported. A pull request that changes only documentation runs the lint checks only.
      - name: Select the checks
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          task=check
          if [[ $EVENT == pull_request ]]; then
            # Without --no-renames, a file moved to a Markdown path shows only its new path.
            paths=$(git diff --no-renames --name-only "$BASE...$HEAD")
            printf 'Changed files:\n%s\n' "$paths"
            task=$(bash scripts/ci_task.sh <<<"$paths")
          fi
          echo "Task: $task"
          echo "task=$task" >>"$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.7
          install: true

      - name: Install Rust check components
        run: mise run setup

      - name: Run repository checks
        env:
          TASK: ${{ steps.select.outputs.task }}
        run: mise run "$TASK"
