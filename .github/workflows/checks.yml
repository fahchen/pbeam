name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run of the earlier push. Each push to main gets its own group, so that no push to main is cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: "0"
      # Measurement for #354: setup (2), the target/ cache with incremental compilation.
      # A restored target/ is useful only when rustc reuses the unchanged code of pbeam-runtime. The value is explicit, so that no default of the runner or the profile can disable it.
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # The next step compares the base and head commits of a pull request, so it needs their history.
          fetch-depth: 0

      # The job always runs, so that the required `checks` status is always reported. A pull request that changes only documentation runs the lint checks only.
      - name: Select the checks
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          task=check
          if [[ $EVENT == pull_request ]]; then
            # Without --no-renames, a file moved to a Markdown path shows only its new path.
            paths=$(git diff --no-renames --name-only "$BASE...$HEAD")
            printf 'Changed files:\n%s\n' "$paths"
            task=$(bash scripts/ci_task.sh <<<"$paths")
          fi
          echo "Task: $task"
          echo "task=$task" >>"$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.7
          install: true

      - name: Install Rust check components
        run: mise run setup

      # Each run saves its own entry, because an entry is immutable. A run restores the newest entry of its own ref, else the newest entry of main. A pull request can read the entries of main, but it cannot write them.
      # Cargo fingerprints still rebuild each changed crate, so a restored entry cannot hide a compile error.
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target
            !target/llvm-cov-target/*.profraw
            !target/llvm-cov-target/*.profdata
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.ref }}-
            ${{ runner.os }}-target-${{ hashFiles('Cargo.lock', 'mise.toml') }}-refs/heads/main-

      - name: Run repository checks
        env:
          TASK: ${{ steps.select.outputs.task }}
        run: mise run "$TASK"

      # An exact key hit is a re-run of the same commit, so the build did not change.
      - name: Save Rust build cache
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target
            !target/llvm-cov-target/*.profraw
            !target/llvm-cov-target/*.profdata
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
