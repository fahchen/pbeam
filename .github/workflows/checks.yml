name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run of the earlier push. Each push to main gets its own group, so that no push to main is cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_AUTO_INSTALL: "0"
  # The cached target/ holds no incremental state, and with incremental compilation the tests of the `opt-level = 1` test profile ran slower in the measurement of #354. The value is explicit, because the profile default enables it.
  CARGO_INCREMENTAL: "0"

# The lint, fixture, and test jobs run in parallel. The `checks` job is the status that the ruleset of main requires. It passes only when each job passes.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.7
          install: true

      - name: Install Rust check components
        run: mise run setup

      # Clippy and the test jobs use different build profiles.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true

      - name: Run the lint checks
        run: mise run lint

  fixtures:
    name: fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select the checks
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          task=check
          if [[ $EVENT == pull_request ]]; then
            paths=$(git diff --no-renames --name-only "$BASE...$HEAD")
            task=$(bash scripts/ci_task.sh <<<"$paths")
          fi
          echo "task=$task" >>"$GITHUB_OUTPUT"

      - name: Set up mise
        if: steps.select.outputs.task == 'check'
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.7
          install: true

      - name: Cache cargo
        if: steps.select.outputs.task == 'check'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: false

      - name: Run fixture checks
        if: steps.select.outputs.task == 'check'
        run: mise exec -- bash scripts/fixture_checks.sh

  # Each test job runs one Rust test slice. The first slice also runs the OTP cases.
  test:
    name: test (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # The next step compares the base and head commits of a pull request, so it needs their history.
          fetch-depth: 0

      # A pull request that changes only documentation runs the lint checks only, so the next steps of the test jobs do not run.
      - name: Select the checks
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          task=check
          otp_beams=true
          if [[ $EVENT == pull_request ]]; then
            # Without --no-renames, a file moved to a Markdown path shows only its new path.
            paths=$(git diff --no-renames --name-only "$BASE...$HEAD")
            printf 'Changed files:\n%s\n' "$paths"
            task=$(bash scripts/ci_task.sh <<<"$paths")
            if ! grep -qE '^(\.gitmodules|mise\.toml|vendor/otp|scripts/otp_suite_beam\.sh|tests/otp/cases\.txt|tests/otp/beam/.*)$' <<<"$paths"; then
              otp_beams=false
            fi
          fi
          echo "Task: $task"
          echo "task=$task" >>"$GITHUB_OUTPUT"
          echo "otp_beams=$otp_beams" >>"$GITHUB_OUTPUT"

      - name: Set up mise
        if: steps.select.outputs.task == 'check'
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.7
          install: true

      - name: Verify upstream OTP test BEAM files
        if: matrix.partition == 1 && steps.select.outputs.task == 'check' && steps.select.outputs.otp_beams == 'true'
        run: |
          git submodule update --init --depth 1 -- vendor/otp
          mise run otp-test-beams

      # The test jobs build the same files, so they share one cache, and only the first job saves it.
      - name: Cache cargo
        if: steps.select.outputs.task == 'check'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: ${{ matrix.partition == 1 }}
          cache-on-failure: true

      - name: Run the tests
        if: steps.select.outputs.task == 'check'
        env:
          NEXTEST_PROFILE: ci
          PBEAM_TEST_PARTITION: slice:${{ matrix.partition }}/${{ strategy.job-total }}
          PBEAM_FIXTURE_MODE: prepare
          PBEAM_CI_EVENT: ${{ github.event_name }}
          PBEAM_CI_BASE: ${{ github.event.pull_request.base.sha }}
          PBEAM_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run test

      - name: Extract test durations
        if: ${{ !cancelled() && steps.select.outputs.task == 'check' }}
        run: python3 scripts/ci_test_durations.py target/nextest/ci/junit.xml target/test-durations.json

      - name: Keep test durations
        if: ${{ !cancelled() && steps.select.outputs.task == 'check' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-durations-${{ matrix.partition }}
          path: target/test-durations.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 1

  checks:
    name: checks
    needs: [lint, fixtures, test]
    # The job runs also when a needed job fails or is cancelled, so that the required status is always reported.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the results of the jobs
        env:
          LINT: ${{ needs.lint.result }}
          FIXTURES: ${{ needs.fixtures.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, fixtures: $FIXTURES, test: $TEST"
          [[ $LINT == success && $FIXTURES == success && $TEST == success ]]
