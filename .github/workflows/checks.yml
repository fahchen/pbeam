name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.0.1
        with:
          version: 2026.10.0
          install: true

      - name: Install Rust check components
        run: mise run setup

      - name: Run repository checks
        run: mise run check
