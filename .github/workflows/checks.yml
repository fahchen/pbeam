name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install: false

      - name: Install check tools
        run: mise install erlang elixir rust rumdl taplo actionlint shellcheck github:taiki-e/cargo-llvm-cov

      - name: Install Rust check components
        run: mise run setup

      - name: Run repository checks
        run: mise run check
