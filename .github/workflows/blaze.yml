name: Blaze

# blaze builds Rust without rustc, from a daemon that keeps the workspace compiled.
# It cannot load this workspace yet: the build scripts of libz-sys and zstd-sys reach
# a function that blaze refuses to compile (docs/blaze.md records the reason and the
# measurements). This job reports what blaze says and does not block a merge, so the
# required `checks` status stays the only gate. Drop `continue-on-error` when a blaze
# release loads the workspace and agrees with cargo on it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run of the earlier push. Each push to main gets its own group, as in the checks workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blaze:
    name: blaze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The store lives for one job, so nothing needs collecting. The default limit, a tenth of the free disk, drops packs that a warm run needs.
      BLAZE_CACHE_MAX: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # The release, the Rust that it builds with, and its store. The key names the release, so a moved pin starts a cold store.
      - name: Cache blaze
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/blaze
            ~/.blaze
            ~/.cache/blaze
          key: blaze-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/blaze-version') }}

      # blaze runs each build script and each test in a sandbox of namespaces that a user makes. Ubuntu keeps a user from making them unless it is told otherwise.
      - name: Allow the sandbox of a build script
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The step is not a gate yet (docs/blaze.md). A failed step keeps the job green, so the save of the cache still runs, and the step after it says that blaze failed.
      - name: Run blaze
        id: blaze
        continue-on-error: true
        run: bash scripts/blaze.sh check --workspace --all-targets

      # The line that says which step of blaze's own plan removes the refusal, and the count of builds that cargo had to do.
      - name: Report the blaze state
        if: always()
        env:
          OUTCOME: ${{ steps.blaze.outcome }}
        run: |
          blaze status || true
          if [[ $OUTCOME != success ]]; then
            echo "::warning file=docs/blaze.md::blaze could not load this workspace. docs/blaze.md records the reason and the condition that makes this job a gate."
          fi
