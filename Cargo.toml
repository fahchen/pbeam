# BeautifulRust lints (https://github.com/morganlinton/BeautifulRust, lints/lints.toml).
# A lint with a hit on main is "allow" until its m23 task fixes the hits.
# Silence a lint locally with #[expect(clippy::<lint>, reason = "...")].
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"                      # each unsafe op needs its own unsafe block
missing_debug_implementations = "allow"              # #1347 turns on: every public type implements Debug
missing_docs = "allow"                               # #1347 turns on: [lib] document every public item
unreachable_pub = "allow"                            # #1346 turns on: pub items that aren't actually exported
rust_2018_idioms = { level = "warn", priority = -1 } # 2018-edition idioms, e.g. Formatter<'_>

# m23 allow list: lints of the groups above with a hit on main. The named task removes the line and fixes the hits.
# #1346
elided_lifetimes_in_paths = "allow"

[lints.clippy]
# Groups first, at lower priority so the individual settings below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "allow"        # #1350 turns on: use ?, or expect("why this cannot fail")
expect_used = "allow"        # expect with a reason is the sanctioned form
panic_in_result_fn = "allow" # #1350 turns on: a fn returning Result shouldn't also panic
missing_panics_doc = "allow" # #1347 turns on: [lib] document reachable panics under # Panics
missing_errors_doc = "allow" # #1347 turns on: [lib] document failures under # Errors

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "allow"                # #1352 turns on: prefer #[expect] over #[allow] (needs rust-version 1.81+)
allow_attributes_without_reason = "allow" # #1352 turns on: every suppression says why (needs rust-version 1.81+)

# Unsafe must be justified.
undocumented_unsafe_blocks = "allow"    # #1348 turns on: // SAFETY: comment on every unsafe block
multiple_unsafe_ops_per_block = "allow" # #1348 turns on: one unsafe operation per block

# API shape.
fn_params_excessive_bools = "allow" # #1349 turns on: bool parameters: use an enum or two methods
struct_excessive_bools = "allow"    # #1349 turns on: many bool fields: use an enum or bitflags
clone_on_ref_ptr = "warn"           # write Rc::clone(&x) so cheap clones are visible
redundant_clone = "warn"            # a clone whose original is never used again
rc_buffer = "allow"                 # #1349 turns on: Rc<String> / Rc<Vec<T>>: use Rc<str> / Rc<[T]>

# Idioms.
string_add = "warn"        # build strings with format! or push_str, not +
wildcard_imports = "allow" # #1346 turns on: no glob imports (use super::* in tests is allowed)

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow" # #1352 turns on: [lib] libraries log, they don't print
print_stderr = "allow" # #1352 turns on: [lib] libraries log, they don't print

# Casts that silently lose information.
as_conversions = "allow"           # #1351 turns on: prefer From / TryFrom
cast_possible_truncation = "allow" # #1351 turns on
cast_sign_loss = "allow"           # #1351 turns on

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"        # a leaf module named after its main item is fine
enum_glob_use = "allow"           # use Enum::* inside a function that matches on it

# m23 allow list: lints of the groups above with a hit on main. The named task removes the line and fixes the hits.
# #1347
doc_markdown = "allow"
missing_fields_in_debug = "allow"
# #1349
unnecessary_wraps = "allow"
too_many_lines = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
trivially_copy_pass_by_ref = "allow"
struct_field_names = "allow"
option_option = "allow"
many_single_char_names = "allow"
large_stack_arrays = "allow"
# #1350
manual_assert = "allow"
# #1351
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
ref_as_ptr = "allow"
borrow_as_ptr = "allow"
ptr_cast_constness = "allow"
checked_conversions = "allow"
