[package]
name = "pbeam-runtime"
version = "0.1.0"
edition = "2024"
publish = false
# List each test target, so that a file of tests/ that is not a target, such as
# a shared helper or a unit test module of src/, is not a test crate.
autotests = false

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", features = ["zlib"] }
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = [
  "feature",
  "fs",
  "hostname",
  "net",
  "resource",
  "socket",
  "uio",
] }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
openssl = { version = "=0.10.75", features = ["vendored"] }
openssl-src = "=300.5.5+3.5.5"
socket2 = { version = "0.6", features = ["all"] }
zlib-rs = "0.6"
zstd = { version = "0.13", default-features = false, features = [
  "experimental",
] }

[build-dependencies]
cc = "1"


# The tests interpret BEAM code; opt-level 1 makes the instrumented test run about two times faster.
# The clippy lint build keeps the dev profile.
[profile.test]
opt-level = 1

# Feature tests run the pbeam binary or a mise task.
