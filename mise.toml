[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
rust = "1.99.0"
rumdl = "0.2.78"
taplo = "0.10.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }

[tasks.setup]
description = "Install check components for the mise-pinned Rust toolchain"
run = 'rustup component add rustfmt clippy llvm-tools-preview --toolchain "$(mise config get --file mise.toml tools.rust)"'

[tasks.lint]
description = "Check documentation, configuration, workflows, and Rust"
run = [
  "rumdl check .",
  "taplo fmt --check",
  "actionlint",
  "shellcheck scripts/*.sh",
  "cd fixtures/hello && mix format --check-formatted && mix compile --warnings-as-errors",
  "mix format --check-formatted && mix compile --warnings-as-errors",
  "cd examples/plug_hello && mix format --check-formatted",
  "cd fixtures/bcrypt && mix format --check-formatted",
  "mix format --check-formatted 'examples/*/*.ex' 'fixtures/*/*.ex'",
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
]

[tasks.test]
description = "Run reference and Rust tests with 100% application line coverage"
run = "bash scripts/test.sh"

[tasks.check]
description = "Run all required checks"
depends = ["lint", "test"]

[tasks.reference]
description = "Verify compiled Hello World fixtures under ERTS"
dir = "fixtures/hello"
run = "mix test --cover --warnings-as-errors"

[tasks.inventory]
description = "Inspect compiled Hello World entry instructions and imports"
dir = "fixtures/hello"
run = '''mix run --no-start -e 'for module <- [Hello, HelloVariant] do path = :code.which(module); {:beam_file, _, exports, _, _, functions} = :beam_disasm.file(path); IO.inspect({module, path, exports}, limit: :infinity); IO.inspect(Enum.filter(functions, fn {:function, name, _, _, _} -> name == :main end), limit: :infinity); IO.inspect(:beam_lib.chunks(path, [:imports, :exports]), limit: :infinity) end' '''

[tasks.beam-inventory]
description = "Disassemble the constant-return BEAM fixture"
run = '''erl -noshell -eval 'io:format("~p~n", [beam_disasm:file("fixtures/beam/constant.beam")]), halt().' '''

[tasks.blaze-check]
description = "Check the workspace with blaze of .github/blaze-version, installed when missing; not a gate yet (docs/blaze.md)"
run = "bash scripts/blaze.sh"

[tasks.check-brief]
description = "Run all required checks and print only the result; the full log goes to target/check.log"
quiet = true
run = "bash scripts/check_brief.sh"

[tasks.test-focus]
description = "Run selected Rust tests and print only the results and failures"
quiet = true
usage = 'arg "[args]..." help="Arguments for cargo test, such as --test group for one target of tests/feature/ or tests/integration/, --lib for the unit tests, a test name filter, or -- --exact" var=#true double_dash="preserve"'
run = 'eval "set -- ${usage_args:-}"; bash scripts/test_focus.sh "$@"'

[tasks.erts-eval]
description = "Evaluate Erlang expressions on the pinned OTP and print the value or the exception"
quiet = true
usage = '''
flag "--pa <dir>" help="Add this directory to the code path, for example fixtures/order"
arg "<expr>" help="Erlang expressions, as for erl -eval"
'''
run = 'escript scripts/erts_eval.escript "${usage_pa:-}" "$usage_expr"'

[tasks.disasm]
description = "Disassemble selected functions of a module or BEAM file with beam_disasm, without line instructions"
quiet = true
usage = '''
arg "<module>" help="A module on the pinned OTP code path, such as erlang or io, or a .beam file"
arg "[function]..." help="Functions as name/arity; with none, all functions" var=#true
'''
run = 'eval "set -- ${usage_function:-}"; escript scripts/disasm.escript "$usage_module" "$@"'

[tasks.fixture-beam]
description = "Compile Erlang fixtures and compare each result with the committed BEAM file, except the CInf and Dbgi chunks"
quiet = true
usage = '''
flag "--write" help="Write the BEAM files that differ or are new"
arg "[source]..." help="Fixture sources, such as fixtures/order/order_probe.erl; with none, all fixtures/*/*.erl" var=#true
'''
run = 'eval "set -- ${usage_source:-}"; escript scripts/fixture_beam.escript ${usage_write:+--write} "$@"'

[tasks.otp-src]
description = "Print a line range of an OTP source file at the pinned OTP tag, with line numbers"
quiet = true
usage = '''
arg "<path>" help="A path in the erlang/otp repository, such as erts/emulator/beam/bif.c"
arg "<start>" help="The first line"
arg "<end>" help="The last line"
'''
run = 'bash scripts/otp_src.sh "$usage_path" "$usage_start" "$usage_end"'

[tasks.example]
description = "Build an example of examples/ and run it on the pbeam binary, or on the pinned ERTS with --erts"
quiet = true
usage = '''
flag "--erts" help="Run the example with erl +S 1 -noshell on the pinned ERTS"
flag "--policy <module>" help="Run the pbeam binary in boot mode (--boot) with this policy module of the example, such as Elixir.RestrictedGuest.Policy"
arg "<name>" help="The directory of the example in examples/, such as hello_world"
'''
run = 'bash scripts/example.sh "$usage_name" ${usage_erts:+--erts} ${usage_policy:+--policy "$usage_policy"}'

[tasks.example-release]
description = "Build the release pbeam binary, build an example, and run it on that binary"
quiet = true
usage = '''
flag "--policy <module>" help="Run the pbeam binary in boot mode (--boot) with this policy module of the example, such as Elixir.RestrictedGuest.Policy"
arg "<name>" help="The directory of the example in examples/, such as hello_world"
'''
run = '''
cargo build --locked --release --bin pbeam
PBEAM_BIN=$(pwd)/target/release/pbeam bash scripts/example.sh "$usage_name" ${usage_policy:+--policy "$usage_policy"}
'''

[tasks.example-executable]
description = "Write one executable of an example of examples/, with the application bundle appended"
quiet = true
usage = '''
flag "--no-build" help="Use the build that is already there"
flag "--output <path>" help="The output path of the executable, default target/examples/<name>.bundle"
arg "<name>" help="The directory of the example in examples/, such as plug_hello"
'''
run = '''
cargo build --locked --release --bin pbeam --bin pbeam_bundle
bash scripts/example.sh "$usage_name" ${usage_no_build:+--no-build} --write-start "target/examples/$usage_name/pbeam.start.list"
output=${usage_output:-target/examples/$usage_name.bundle}
bundle=${output%.bundle}.pbeamb
mkdir -p "$(dirname "$output")" "$(dirname "$bundle")"
release_dir=$(cd "target/examples/$usage_name" && pwd -P)
output_dir=$(cd "$(dirname "$output")" && pwd -P)
case "$output_dir/" in
    "$release_dir"/*)
        echo "example-executable: --output must be outside the build directory target/examples/$usage_name." >&2
        exit 1
        ;;
esac
for path in "$output" "$bundle"; do
    if [ -L "$path" ]; then
        echo "example-executable: $path is a symbolic link. Name a path that is not a link, outside the build directory." >&2
        exit 1
    fi
done
if [ -f "examples/$usage_name/mix.exs" ]; then
    target/release/pbeam_bundle bundle "target/examples/$usage_name" "$bundle" elixir start_cli "target/examples/$usage_name/pbeam.start.list"
else
    entry=Elixir.$(printf '%s' "$usage_name" | awk -F_ '{ for (i = 1; i <= NF; i++) printf "%s%s", toupper(substr($i, 1, 1)), substr($i, 2) }')
    target/release/pbeam_bundle fixture "$bundle" "$entry" main "target/examples/$usage_name/pbeam.start.list" "target/examples/$usage_name/pbeam.beams" "target/examples/$usage_name/consolidated"
fi
target/release/pbeam_bundle executable target/release/pbeam "$bundle" "$output"
echo "Wrote $output"
'''

[tasks.bench-dispatch]
description = "Measure the interpreter dispatch baseline on a release build and write target/dispatch-baseline.txt"
run = "bash scripts/dispatch_baseline.sh"

[tasks.bench-attribution]
description = "Measure the instruction attribution reference points and micro-costs on a release build and write target/dispatch-attribution.txt"
usage = '''
arg "[label]" help="The label of the build, such as the name of the scratch ablation variant"
arg "[output]" help="The output file; the default is target/dispatch-attribution.txt"
'''
run = 'bash scripts/dispatch_attribution.sh "${usage_label:-base}" "${usage_output:-target/dispatch-attribution.txt}"'

[tasks.bench-drop]
description = "Measure the term drop cost on a release build and write target/drop-costs.txt"
run = "bash scripts/drop_costs.sh"

[tasks.bench-release]
description = "Measure the scheduler release of a large shared graph on a release build and write target/release-costs.txt"
run = "bash scripts/release_costs.sh"

[tasks.bench-term]
description = "Measure the cost of one term operation on a release build and write target/term-costs.txt"
run = "bash scripts/term_costs.sh"

[tasks.bench-live-bytes]
description = "Measure the peak live bytes of one Terra scene on a release build and write target/live-bytes.txt"
run = "bash scripts/live_bytes.sh"

[tasks.terra-reference]
description = "Run the Terra Counter example on the pinned ERTS in a pseudo-terminal, check each screen and the terminal restore, and write the call inventory (macOS)"
run = "bash scripts/terra_reference.sh"

[tasks.issue]
description = "Print the title, labels, milestone, and named body sections of an issue"
quiet = true
usage = '''
arg "<number>" help="The issue number"
arg "[section]..." help="Section headings or their first words, such as Acceptance or Dependencies; with none, print the headings only" var=#true
'''
run = 'eval "set -- ${usage_section:-}"; bash scripts/issue.sh "$usage_number" "$@"'
