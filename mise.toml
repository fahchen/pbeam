[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
rust = "1.99.0"
rumdl = "0.2.78"
taplo = "0.10.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"

[tasks.lint]
description = "Check documentation, configuration, workflows, and Rust"
run = [
  "rumdl check .",
  "taplo fmt --check",
  "actionlint",
  "shellcheck scripts/*.sh",
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
]

[tasks.test]
description = "Run Rust tests and require 100% line coverage"
run = "bash scripts/test.sh"

[tasks.check]
description = "Run all required checks"
depends = ["lint", "test"]
